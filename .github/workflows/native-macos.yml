name: Native macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # Standard macos-15 GitHub-hosted runners are Apple Silicon arm64.
    runs-on: macos-15
    steps:
      - name: Require Apple Silicon runner
        run: |
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build native app
        run: ./build-app.sh

      - name: Audit Apple Silicon bundle
        run: ./tests/test_apple_silicon_bundle.sh

      - name: Run rc.2 regression tests
        run: ./tests/test_rc2_regressions.sh

      - name: Run native Agent tests
        run: ./tests/test_native_agent.sh

      - name: Run v3 RC stability tests
        run: ./tests/test_v3_rc_stability.sh

      - name: Run LaunchAgent lifecycle tests
        run: ./tests/test_launch_agent_lifecycle.sh

      - name: Upload Apple Silicon RC artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-File-Sorter-Mac-Apple-Silicon-v3.0.0-rc.2
          path: artifacts/AI-File-Sorter-Mac-Apple-Silicon-v3.0.0-rc.2.zip
          if-no-files-found: error
